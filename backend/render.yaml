services:
  - type: web
    name: itsaproject-backend
    runtime: docker
    region: oregon # Update to your preferred region (e.g., frankfurt, ohio, singapore)
    plan: free # Can be starter, standard, etc.
    # To deploy from a sub-directory, specify the root
    rootDir: backend
    envVars:
      - key: APP_NAME
        value: "UPSA Final Year Project Management System"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://itsaproject-backend.onrender.com" # Update if you have a custom domain
      - key: APP_KEY
        generateValue: true # Generates a random secure string. Ensure your Laravel app can use this base64 formatted key or set it manually in Dashboard.

      # REQUIRED: the deployed frontend's origin, for CORS. Without this,
      # every request from the browser will be silently rejected even if
      # the backend itself is healthy.
      - key: FRONTEND_URL
        value: "https://itsaproject.vercel.app" # Update to match your actual Vercel URL

      # REQUIRED: a real database. Render's free plan no longer includes a
      # permanent free Postgres instance, so use an external free Postgres
      # provider instead — Supabase or Neon both work well and need no
      # code changes here, just real values below. Laravel's migrations
      # use portable column types, so MySQL works too if you change
      # DB_CONNECTION to mysql and DB_PORT to 3306.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: REPLACE_ME # e.g. db.xxxxxxxxxxxx.supabase.co, or ep-xxxx.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: REPLACE_ME # usually "postgres" on Supabase
      - key: DB_USERNAME
        value: REPLACE_ME # usually "postgres" on Supabase
      - key: DB_PASSWORD
        value: REPLACE_ME
        sync: false # marks it sensitive so Render doesn't echo it back in the dashboard
      - key: DB_SSLMODE
        value: require # both Supabase and Neon require SSL on external connections

      # Safe defaults for a single-web-process deployment (no separate
      # queue worker running).
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # REQUIRED to actually deliver emails (password resets, project
      # decision notifications). Sign up free at https://resend.com,
      # create an API key at https://resend.com/api-keys, and paste it
      # below (or set it directly in the Render dashboard). Without a
      # verified domain, Resend only lets you send FROM
      # onboarding@resend.dev — that's fine to start with.
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: "onboarding@resend.dev" # switch to an address on your own verified domain once you add one in Resend
      - key: RESEND_API_KEY
        value: REPLACE_ME
        sync: false # marks it sensitive so Render doesn't echo it back in the dashboard

      # Student-uploaded project documents (proposals, chapters, etc.).
      # FILESYSTEM_DISK defaults to "local", which works but is NOT
      # persistent on Render — every uploaded file is lost on the next
      # deploy or restart. Before this feature goes live for real,
      # switch to a persistent disk: the easiest option is Supabase
      # Storage (S3-compatible, same project you're already using for
      # the database) — create a bucket, then set FILESYSTEM_DISK=s3
      # and fill in AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_BUCKET
      # / AWS_DEFAULT_REGION / AWS_ENDPOINT (Supabase's S3 endpoint) /
      # AWS_USE_PATH_STYLE_ENDPOINT=true from Supabase's Storage settings.
      - key: FILESYSTEM_DISK
        value: local
