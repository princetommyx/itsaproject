services:
  - type: web
    name: itsaproject-backend
    runtime: docker
    # frankfurt, not the oregon default: Render has no African region, and
    # Frankfurt is the closest one to Accra — Oregon is roughly the furthest
    # point on earth from Ghana, so it penalises both the round trip from
    # students' phones AND every query to the database.
    #
    # The database must be in the SAME region as this service. That matters
    # more than which region you pick: a request runs many queries, and each
    # one pays the app-server-to-database round trip. Cross-continent that is
    # ~150ms+ per query, which is what turns a fast page into a slow one.
    # Check the real number with GET /api/admin/diagnostics (admin login
    # required) — it reports the measured query round-trip and a verdict.
    region: frankfurt
    # NOTE on the "long time to load dashboard / long time to log in" complaint:
    # the free plan spins the service down after ~15 minutes with no traffic.
    # The next request has to boot the whole container again, which routinely
    # takes 30-60+ seconds before the login/dashboard call even starts — that's
    # almost certainly what's being felt as slowness, not a bug in the app.
    # Two ways to fix it for real:
    #   1. Upgrade this service to at least the "starter" plan ($7/mo) — it
    #      never spins down, so every request just hits a warm process.
    #   2. Stay on free and ping https://<this-service>.onrender.com/up every
    #      10-14 minutes from an external scheduler (e.g. cron-job.org) to
    #      keep it warm. This works but is a workaround, not a fix — it still
    #      cold-starts after Render's periodic maintenance restarts, and Render
    #      may throttle services it detects are being kept artificially warm.
    # A same-region choice above also matters even once it's warm: every DB
    # query pays a network round trip to Supabase, so put this service in the
    # same region as your Supabase project rather than leaving it at the
    # oregon default if your database is elsewhere.
    plan: free # Can be starter, standard, etc. — see the cold-start note above.
    # To deploy from a sub-directory, specify the root
    rootDir: backend
    envVars:
      - key: APP_NAME
        value: "UPSA Final Year Project Management System"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://itsaproject-backend.onrender.com" # Update if you have a custom domain
      - key: APP_KEY
        generateValue: true # Generates a random secure string. Ensure your Laravel app can use this base64 formatted key or set it manually in Dashboard.

      # bcrypt cost for password hashing. 10 rather than Laravel's default
      # of 12 — cost 12 can take 1-3s per login on this free plan's
      # constrained CPU, since bcrypt is deliberately slow. 10 is still a
      # normal production-grade cost.
      - key: BCRYPT_ROUNDS
        value: "10"

      # REQUIRED: the deployed frontend's origin, for CORS. Without this,
      # every request from the browser will be silently rejected even if
      # the backend itself is healthy.
      - key: FRONTEND_URL
        value: "https://itsaproject.vercel.app" # Update to match your actual Vercel URL

      # REQUIRED: a real database. Render's free plan no longer includes a
      # permanent free Postgres instance, so use an external free Postgres
      # provider instead — Supabase or Neon both work well and need no
      # code changes here, just real values below. Laravel's migrations
      # use portable column types, so MySQL works too if you change
      # DB_CONNECTION to mysql and DB_PORT to 3306.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: REPLACE_ME # e.g. db.xxxxxxxxxxxx.supabase.co, or ep-xxxx.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: REPLACE_ME # usually "postgres" on Supabase
      - key: DB_USERNAME
        value: REPLACE_ME # usually "postgres" on Supabase
      - key: DB_PASSWORD
        sync: false # marks it sensitive so Render doesn't echo it back in the dashboard
      - key: DB_SSLMODE
        value: require # both Supabase and Neon require SSL on external connections

      # Safe defaults for a single-web-process deployment (no separate
      # queue worker running).
      - key: SESSION_DRIVER
        value: database
      # NOT database. Every authenticated request passes Laravel's rate
      # limiter, and the limiter reads and writes its counter through the
      # cache store: measured at 6 cache queries per request (5 reads + 1
      # write, all on the same key) before the endpoint does any work of its
      # own. On SQLite locally that is 0.6ms and invisible. Here the database
      # is a separate Supabase host, so those 6 queries are 6 network round
      # trips on every single API call — at a 20ms round trip that is 120ms
      # of pure throttling overhead per request, and if the database ends up
      # in a different region from this service it is far worse. The file
      # store keeps the counter on the container's own disk: same throttle,
      # no round trips. It resets on deploy, which for a rate limiter is
      # harmless.
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # REQUIRED to actually deliver emails (password resets, project
      # decision notifications). Sign up free at https://resend.com,
      # create an API key at https://resend.com/api-keys, and paste it
      # below (or set it directly in the Render dashboard). Without a
      # verified domain, Resend only lets you send FROM
      # onboarding@resend.dev — that's fine to start with.
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: "onboarding@resend.dev" # switch to an address on your own verified domain once you add one in Resend
      - key: RESEND_API_KEY
        sync: false # marks it sensitive so Render doesn't echo it back in the dashboard

      # Student-uploaded project documents (proposals, chapters, etc.).
      # FILESYSTEM_DISK defaults to "local", which works but is NOT
      # persistent on Render — every uploaded file is lost on the next
      # deploy or restart. Before this feature goes live for real,
      # switch to a persistent disk: the easiest option is Supabase
      # Storage (S3-compatible, same project you're already using for
      # the database) — create a bucket, then set FILESYSTEM_DISK=s3
      # and fill in AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_BUCKET
      # / AWS_DEFAULT_REGION / AWS_ENDPOINT (Supabase's S3 endpoint) /
      # AWS_USE_PATH_STYLE_ENDPOINT=true from Supabase's Storage settings.
      - key: FILESYSTEM_DISK
        value: local
