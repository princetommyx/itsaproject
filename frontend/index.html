<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>UPSA Final Year Project Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking first paint. As a plain stylesheet this sits
         in the critical path: if fonts.googleapis.com is slow, firewalled, or
         unreachable, the browser paints nothing until the request gives up —
         measured at ~12.8s to first paint on a network with no route to
         Google. media="print" takes it out of that path; the onload promotes
         it once it arrives. The token stack falls back to Arial meanwhile, so
         text is readable immediately either way. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      />
    </noscript>
      <!-- ToastMagic runtime. Copied from the composer package into public/ —
         see public/vendor/toast-magic/README.md. Configured before the script
         runs, because the runtime reads window.toastMagicConfig at load. -->
    <link rel="stylesheet" href="/vendor/toast-magic/laravel-toaster-magic.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script src="/vendor/toast-magic/laravel-toaster-magic.js"></script>
  </body>
</html>
